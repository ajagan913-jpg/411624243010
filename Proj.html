<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Website</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        font-family: Arial, sans-serif;
        padding:20px;
    }

    /* Navbar - Mobile First */
    nav{
        display:flex;
        flex-direction:column;
        background-color:#f2f2f2;
        padding:10px;
    }

    nav a{
        text-decoration:none;
        color:black;
        padding:10px;
    }

    /* Desktop Navbar */
    @media (min-width:768px){
        nav{
            flex-direction:row;
            gap:30px;
        }
    }

    h1{
        margin:20px 0;
        text-align:center;
    }

    /* Image */
    img{
        display:block;
        width:300px;
        max-width:100%;
        border-radius:50px;
        margin:20px auto;
    }

    /* Video */
    video{
        width:50vw;
        background-colorblue:lightgrey;
        padding:15px;
        display:block;
        margin:auto;   
    
    }


    table{
        width:1000px;
        border-collapse:collapse;
        margin-top:20px;
    }

    th,td{
        border:1px solid black;
        padding:10px;
        text-align:center;
    }

    th{
        background-color:white;
    }

    button{
        background-color:blue;
        color:white;
        border:none;
        padding:12px 20px;
        margin:20px;
        cursor:pointer;
        transition:0.3s;
    }

    button:hover{
        background-color:black;
        transform:scale(1.05);
    }

    .grid-container{
        display:grid;
        grid-template-columns:repeat(2,1fr);
        gap:10px;
        margin-top:30px;
    }

    .grid-item{
        background-color:beige;
        padding:20px;
        text-align:center;
        font-weight:bold;
    }

    @media (max-width:767px){
        .grid-container{
            grid-template-columns:repeat(2,1fr);
        }
    }
</style>

</head>
<body>

<nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
</nav>
<h1>Responsive Website</h1>
<img src= "image.png"Sample Image">

<video controls>
    <source src="video.mp4" type="video/mp4">
    Your browser does not support video.
</video>
<table>
    <tr>
        <th>1</th>
        <th>2</th>
        <th>3</th>
    </tr>
    <tr>
        <td>apple</td>
        <td>mango</td>
        <td>orange Text</td>
    </tr>
    <tr>
        <td>free fire</td>
        <td>carrot</td>
        <td>ic cream</td>
    </tr>
</table>
<button>Click Me</button>
<div class="grid-container">
    <div class="grid-item">1</div>
    <div class="grid-item">2</div>
    <div class="grid-item">3</div>
    <div class="grid-item">4</div>
    <div class="grid-item">5</div>
    <div class="grid-item">6</div>
    <div class="grid-item">7</div>
    <div class="grid-item">8</div>
</div>

</body>
</html>
